<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620">
  <rect width="980" height="620" fill="#ffffff"/>
  <text x="490" y="34" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#1b3a4b">Mainz pouch that will not reach</text>
  <text x="490" y="56" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#5c6b7a">Divide the right colic artery. Leave the ileocolic artery. That is the pouch.</text>
  <path d="M150 250 C150 180 230 150 300 170 C370 150 430 190 430 250 L410 430 C410 480 250 490 220 450 C180 490 150 430 150 380 Z" fill="#f6e6d4" stroke="#1b3a4b" stroke-width="2"/>
  <text x="290" y="230" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#1b3a4b">right colon</text>
  <ellipse cx="175" cy="430" rx="55" ry="42" fill="#d7ebf7" stroke="#1b3a4b" stroke-width="2.5"/>
  <text x="175" y="426" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#1b3a4b" font-weight="700">Mainz</text>
  <text x="175" y="442" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#1b3a4b">pouch</text>
  <path d="M120 430 C70 430 50 470 60 500" fill="none" stroke="#1b3a4b" stroke-width="8" stroke-linecap="round"/>
  <text x="40" y="530" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#5c6b7a">terminal ileum</text>
  <path d="M200 470 C200 530 250 560 300 575" fill="none" stroke="#8a3030" stroke-width="3" stroke-dasharray="5 4"/>
  <circle cx="300" cy="575" r="7" fill="none" stroke="#8a3030" stroke-width="2"/>
  <text x="316" y="600" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#8a3030">urethral stump, not reached</text>
  <path d="M430 200 C520 160 620 170 700 210" fill="none" stroke="#c4a574" stroke-width="16" stroke-linecap="round"/>
  <text x="620" y="160" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#7a6a52">transverse colon</text>
  <path d="M250 360 C300 300 340 240 390 190 C470 160 560 180 640 200" fill="none" stroke="#6d8f62" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="400" y="145" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#3d5c34">marginal artery, arc of Drummond</text>
  <path d="M520 430 L390 250" fill="none" stroke="#c23b3b" stroke-width="4"/>
  <path d="M520 430 L300 390" fill="none" stroke="#c23b3b" stroke-width="4"/>
  <path d="M520 430 L640 230" fill="none" stroke="#c23b3b" stroke-width="4"/>
  <circle cx="520" cy="430" r="16" fill="#f7cfc8" stroke="#8a3030" stroke-width="2"/>
  <text x="520" y="434" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="11" fill="#8a3030">SMA</text>
  <circle cx="300" cy="390" r="11" fill="#2f7d4f" stroke="#1b3a4b" stroke-width="2"/>
  <text x="250" y="415" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#2f7d4f" font-weight="700">Ileocolic. Keep.</text>
  <g>
    <circle cx="390" cy="250" r="14" fill="#ffffff" stroke="#8a3030" stroke-width="2"/>
    <path d="M380 240 L400 260 M400 240 L380 260" stroke="#8a3030" stroke-width="2.5"/>
  </g>
  <text x="360" y="230" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#8a3030" font-weight="700">Right colic. Divide.</text>
  <circle cx="640" cy="230" r="8" fill="#c23b3b"/>
  <text x="660" y="226" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#1b3a4b" font-weight="700">Middle colic. Leave it.</text>
</svg>
