<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580">
  <rect width="980" height="580" fill="#ffffff"/>
  <text x="490" y="34" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#1b3a4b">Sartorius cover of the femoral vessels</text>
  <text x="490" y="56" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#5c6b7a">Right groin, anterior. Lateral is left. The sartorius is turned over the vessels.</text>
  <circle cx="150" cy="110" r="26" fill="#efe6d6" stroke="#1b3a4b" stroke-width="2"/>
  <text x="150" y="78" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#1b3a4b" font-weight="700">ASIS</text>
  <circle cx="560" cy="124" r="14" fill="#efe6d6" stroke="#1b3a4b" stroke-width="2"/>
  <text x="584" y="112" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#1b3a4b">pubic tubercle</text>
  <line x1="174" y1="120" x2="548" y2="130" stroke="#7a6a52" stroke-width="7" stroke-linecap="round"/>
  <text x="330" y="108" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#7a6a52">inguinal ligament</text>
  <rect x="250" y="150" width="28" height="300" rx="8" fill="#c23b3b"/>
  <rect x="292" y="150" width="36" height="300" rx="10" fill="#2f5f9e"/>
  <text x="36" y="250" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#c23b3b" font-weight="700">Femoral artery</text>
  <line x1="168" y1="246" x2="250" y2="270" stroke="#c23b3b" stroke-width="1.5"/>
  <text x="36" y="320" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#2f5f9e" font-weight="700">Femoral vein</text>
  <line x1="158" y1="316" x2="292" y2="340" stroke="#2f5f9e" stroke-width="1.5"/>
  <path d="M190 168 C300 230 400 230 500 176" fill="none" stroke="#e7a3a3" stroke-width="36" stroke-linecap="round"/>
  <path d="M230 168 L246 196 M280 186 L294 214 M330 196 L342 224 M380 196 L390 224 M430 184 L438 210" stroke="#1b3a4b" stroke-width="1.6"/>
  <text x="560" y="190" font-family="ui-sans-serif, sans-serif" font-size="16" fill="#8a3030" font-weight="700">Sartorius, transposed</text>
  <text x="560" y="212" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#8a3030">Origin taken off the ASIS.</text>
  <text x="560" y="230" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#8a3030">Sewn to the inguinal ligament.</text>
  <text x="560" y="248" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#8a3030">Belly covers artery and vein.</text>
  <path d="M170 140 C260 280 340 420 420 530" fill="none" stroke="#9aa7b2" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="440" y="524" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#5c6b7a">dashed: old course of sartorius</text>
  <rect x="430" y="250" width="34" height="230" rx="12" fill="#f0c2c2" stroke="#1b3a4b" stroke-width="1.5"/>
  <text x="480" y="340" font-family="ui-sans-serif, sans-serif" font-size="15" fill="#1b3a4b" font-weight="700">Gracilis</text>
  <text x="480" y="360" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#5c6b7a">Medial thigh. Not used.</text>
  <text x="36" y="560" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#5c6b7a">Vastus medialis, vastus lateralis, and adductor longus are also out of position for this cover.</text>
</svg>
