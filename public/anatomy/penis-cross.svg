<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520">
  <rect width="760" height="520" fill="#fff"/>
  <text x="28" y="36" font-family="Georgia, serif" font-size="20" fill="#1c1915">Penis, cross section</text>
  <ellipse cx="230" cy="250" rx="150" ry="175" fill="#f6e3d8" stroke="#c9a08e" stroke-width="10"/>
  <ellipse cx="230" cy="250" rx="128" ry="152" fill="none" stroke="#b9836a" stroke-width="6"/>
  <ellipse cx="175" cy="210" rx="62" ry="78" fill="#e07a5f" stroke="#6e3424" stroke-width="4"/>
  <ellipse cx="285" cy="210" rx="62" ry="78" fill="#e07a5f" stroke="#6e3424" stroke-width="4"/>
  <ellipse cx="230" cy="330" rx="48" ry="42" fill="#d9896a" stroke="#6e3424" stroke-width="4"/>
  <ellipse cx="230" cy="332" rx="14" ry="12" fill="#f7f1ea" stroke="#6e3424" stroke-width="2"/>
  <circle cx="230" cy="145" r="7" fill="#2f6f9f"/>
  <circle cx="210" cy="132" r="5" fill="#b4332a"/>
  <circle cx="250" cy="132" r="5" fill="#b4332a"/>
  <circle cx="192" cy="150" r="4" fill="#e2b340"/>
  <circle cx="268" cy="150" r="4" fill="#e2b340"/>
  <text x="430" y="130" font-family="Georgia, serif" font-size="16" fill="#1c1915">Deep dorsal vein</text>
  <text x="430" y="152" font-family="Georgia, serif" font-size="14" fill="#5c564c">Midline, inside Buck fascia.</text>
  <text x="430" y="190" font-family="Georgia, serif" font-size="16" fill="#1c1915">Dorsal arteries and nerves</text>
  <text x="430" y="212" font-family="Georgia, serif" font-size="14" fill="#5c564c">Paired, just lateral to the vein.</text>
  <text x="430" y="260" font-family="Georgia, serif" font-size="16" fill="#1c1915">Corpora cavernosa</text>
  <text x="430" y="282" font-family="Georgia, serif" font-size="14" fill="#5c564c">Each has its own tunica albuginea.</text>
  <text x="430" y="330" font-family="Georgia, serif" font-size="16" fill="#1c1915">Corpus spongiosum</text>
  <text x="430" y="352" font-family="Georgia, serif" font-size="14" fill="#5c564c">The urethra travels inside it.</text>
  <text x="430" y="400" font-family="Georgia, serif" font-size="16" fill="#1c1915">Buck fascia</text>
  <text x="430" y="422" font-family="Georgia, serif" font-size="14" fill="#5c564c">Wraps all three bodies. Dartos and skin are outside it.</text>
</svg>
