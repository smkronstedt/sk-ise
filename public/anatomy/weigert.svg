<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560">
  <rect width="760" height="560" fill="#fff"/>
  <text x="28" y="36" font-family="Georgia, serif" font-size="20" fill="#1c1915">Weigert-Meyer duplex</text>
  <text x="28" y="60" font-family="Georgia, serif" font-size="14" fill="#5c564c">Upper pole inserts medial and inferior. Lower pole inserts lateral and superior.</text>
  <path d="M250 80 C180 80 150 140 160 190 C170 250 230 270 250 250 C270 270 330 250 340 190 C350 140 320 80 250 80 Z" fill="#e7b2a8" stroke="#8d3b3b" stroke-width="2"/>
  <path d="M250 230 C190 250 160 320 175 390 C190 450 240 470 250 450 C260 470 310 450 325 390 C340 320 310 250 250 230 Z" fill="#f0c7bc" stroke="#8d3b3b" stroke-width="2"/>
  <text x="188" y="150" font-family="Georgia, serif" font-size="14" fill="#1c1915">Upper pole</text>
  <text x="190" y="340" font-family="Georgia, serif" font-size="14" fill="#1c1915">Lower pole</text>
  <path d="M240 170 C300 280 340 400 330 500" fill="none" stroke="#c45c26" stroke-width="8" stroke-linecap="round"/>
  <path d="M230 340 C180 400 160 450 220 472" fill="none" stroke="#2f6f9f" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="360" cy="500" rx="150" ry="36" fill="#f4d7d2" stroke="#8d3b3b" stroke-width="2"/>
  <circle cx="330" cy="508" r="7" fill="#c45c26"/>
  <circle cx="220" cy="478" r="7" fill="#2f6f9f"/>
  <text x="430" y="160" font-family="Georgia, serif" font-size="16" fill="#c45c26">Upper moiety ureter</text>
  <text x="430" y="184" font-family="Georgia, serif" font-size="14" fill="#5c564c">Medial and inferior orifice.</text>
  <text x="430" y="206" font-family="Georgia, serif" font-size="14" fill="#5c564c">Obstructs. Ureterocele lives here.</text>
  <text x="430" y="260" font-family="Georgia, serif" font-size="16" fill="#2f6f9f">Lower moiety ureter</text>
  <text x="430" y="284" font-family="Georgia, serif" font-size="14" fill="#5c564c">Lateral and superior orifice.</text>
  <text x="430" y="306" font-family="Georgia, serif" font-size="14" fill="#5c564c">This is the one that refluxes.</text>
</svg>
